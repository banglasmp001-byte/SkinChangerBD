name: Build SkinChangerBD

on:
  push:
    branches: [ "main", "master" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build MC 1.21.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/loom-cache
          key: gradle-1.21.1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-1.21.1-
            gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace -Pmodmenu_version=skip
        env:
          JAVA_TOOL_OPTIONS: "-Xmx2G"

      - name: Rename JAR
        run: |
          mkdir -p artifacts
          JAR=$(find build/libs -name "SkinChangerBD-*.jar" \
                ! -name "*-sources.jar" \
                ! -name "*-dev.jar" \
                ! -name "*-dev-shadow.jar" \
                | head -1)
          if [ -n "$JAR" ]; then
            cp "$JAR" "artifacts/SkinChangerBD-1.21.1.jar"
            echo "Built: artifacts/SkinChangerBD-1.21.1.jar"
            ls -lh artifacts/
          else
            echo "ERROR: JAR not found in build/libs/"
            ls -la build/libs/ || true
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkinChangerBD-1.21.1
          path: artifacts/SkinChangerBD-1.21.1.jar
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SkinChangerBD-1.21.1
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/SkinChangerBD-1.21.1.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
